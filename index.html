<!DOCTYPE html>
<html>
<head>
  <title>Loan Accounting Book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://cserhbafuyzvvlykmpgf.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZXJoYmFmdXl6dnZseWttcGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMjA3MTQsImV4cCI6MjA5MjU5NjcxNH0.WbaltD6pcXj7jdYl8Fx3qKJY7Z1H2KVro_lh58LS9Pc";

    const supabase = createClient(supabaseUrl, supabaseKey);

    function monthsBetween(dateStr) {
      if (!dateStr) return 1;
      const start = new Date(dateStr);
      const now = new Date();
      let diff = (now - start) / (1000 * 60 * 60 * 24 * 30);
      return diff > 0 ? diff : 1;
    }

    function safe(num) {
      return isNaN(num) || num == null ? 0 : Number(num);
    }

    function calcInterest(amount, rate, months) {
      return (safe(amount) * safe(rate) * months) / 100;
    }

    async function loadData() {
      const { data, error } = await supabase.from('loan_summary').select('*');

      if (error) {
        document.body.innerHTML = "❌ Error: " + error.message;
        return;
      }

      let html = `
        <div style="font-family:Arial;padding:15px;background:#f4f4f4;">
          <h2>📒 Loan Accounting Book</h2>
      `;

      data.forEach(item => {

        let name = item.borrower_name || "Unknown";
        let date = item.loan_date || "Not set";
        let amount = safe(item.amount);
        let rate = safe(item.interest_rate);
        let paid = safe(item.total_paid);

        let months = monthsBetween(item.loan_date);
        let interest = calcInterest(amount, rate, months);
        let balance = amount + interest - paid;

        html += `
          <div style="background:white;padding:12px;margin:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)">
            
            <h3>👤 ${name}</h3>
            <p>📅 Loan Date: ${date}</p>
            <p>💰 Loan Amount: ₹${amount}</p>
            <p>📈 Interest Rate: ${rate}% / month</p>

            <p>📊 Interest: ₹${interest.toFixed(2)}</p>
            <p>💸 Paid: ₹${paid}</p>

            <hr>

            <h3>⚖ Balance: ₹${balance.toFixed(2)}</h3>

          </div>
        `;
      });

      html += `</div>`;
      document.body.innerHTML = html;
    }

    loadData();
  </script>
</head>

<body>
  Loading Loan Data...
</body>
</html>
