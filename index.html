<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Cashbook Pro</title>

<style>
:root { --primary:#2563eb; --bg:#f8fafc; --text:#1e293b; --red:#dc2626; --green:#16a34a; }
body { font-family:Arial; background:var(--bg); margin:0; padding:15px; }
.card { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
.summary { background:#f1f5f9; padding:10px; border-radius:8px; }
.timeline { border-left:2px solid #ccc; margin-left:10px; padding-left:15px; }
.btn { padding:10px; border:none; border-radius:6px; cursor:pointer; }
.green { background:var(--green); color:white; }
.blue { background:var(--primary); color:white; }
</style>
</head>

<body>

<div id="cashbook-view">
<h2>📒 Loan Cashbook</h2>
<div id="main">Loading...</div>
</div>

<div id="detail-view" style="display:none;"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://cserhbafuyzvvlykmpgf.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZXJoYmFmdXl6dnZseWttcGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMjA3MTQsImV4cCI6MjA5MjU5NjcxNH0.WbaltD6pcXj7jdYl8Fx3qKJY7Z1H2KVro_lh58LS9Pc"
);

const safe = n => isNaN(n) || n==null ? 0 : Number(n);

function formatDate(d){
  if(!d) return "N/A";
  return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}

// -------- INTEREST ENGINE --------
function calculate(b, rates, payments){
  rates = (rates||[]).sort((a,b)=>new Date(a.effective_date)-new Date(b.effective_date));

  let bal = safe(b.principal);
  let totalPaid = 0;
  let totalInterest = 0;

  const events = [
    ...rates.map(r=>({date:new Date(r.effective_date), type:'rate', val:safe(r.rate)})),
    ...payments.map(p=>({date:new Date(p.payment_date), type:'pay', val:safe(p.amount)}))
  ].sort((a,b)=>a.date-b.date);

  let currentDate = new Date(b.start_date);
  let rate = rates.length ? safe(rates[0].rate) : 0;
  const today = new Date();

  events.forEach(e=>{
    if(e.date>today) return;

    let months = (e.date-currentDate)/(1000*60*60*24*30);
    let interest = bal*(rate/100)*months;

    totalInterest += interest;
    bal += interest;

    if(e.type==="rate") rate=e.val;
    else { bal -= e.val; totalPaid += e.val; }

    currentDate = e.date;
  });

  let m = (today-currentDate)/(1000*60*60*24*30);
  let interest = bal*(rate/100)*m;

  totalInterest += interest;
  bal += interest;

  return {bal, totalPaid, totalInterest};
}

// -------- LOAD TABLE --------
async function load(){
  const {data: borrowers, error} = await supabase.from("borrowers").select("*");
  console.log("BORROWERS:", borrowers);
  const {data: rates} = await supabase.from("rate_changes").select("*");
  const {data: payments} = await supabase.from("payments").select("*");

  if(error){
    document.getElementById("main").innerHTML="Error loading data";
    return;
  }

  let html="<table width='100%'><tr><th>Name</th><th>Loan</th><th>Balance</th></tr>";

  borrowers.forEach(b=>{
    const r = rates.filter(x=>x.borrower_id===b.id);
    const p = payments.filter(x=>x.borrower_id===b.id);
    const s = calculate(b,r,p);

    html += `<tr onclick="showDetail(${b.id})">
      <td style="color:blue">${b.name}</td>
      <td>₹${safe(b.principal)}</td>
      <td style="color:red">₹${Math.round(s.bal)}</td>
    </tr>`;
  });

  html+="</table>";
  document.getElementById("main").innerHTML = "<pre>" + JSON.stringify(borrowers, null, 2) + "</pre>";
}

// -------- DETAIL VIEW --------
window.showDetail = async (id)=>{
  const {data:b} = await supabase.from("borrowers").select("*").eq("id",id).single();
  const {data:r} = await supabase.from("rate_changes").select("*").eq("borrower_id",id);
  const {data:p} = await supabase.from("payments").select("*").eq("borrower_id",id);

  const s = calculate(b,r,p);

  document.getElementById("cashbook-view").style.display="none";
  const d = document.getElementById("detail-view");
  d.style.display="block";

  const events = [
    {date:b.start_date, text:"Loan Started ₹"+b.principal},
    ...(r||[]).map(x=>({date:x.effective_date,text:"Rate "+x.rate+"%"})),
    ...(p||[]).map(x=>({date:x.payment_date,text:"Paid ₹"+x.amount}))
  ].sort((a,b)=>new Date(a.date)-new Date(b.date));

  d.innerHTML=`
    <button class="btn blue" onclick="back()">← Back</button>

    <div class="card">
      <h3>${b.name}</h3>

      <div class="summary">
        <div>Paid: ₹${Math.round(s.totalPaid)}</div>
        <div>Interest: ₹${Math.round(s.totalInterest)}</div>
        <b>Balance: ₹${Math.round(s.bal)}</b>
      </div>

      <h4>Add Payment</h4>
      <input id="amt" type="number" placeholder="Amount"><br><br>
      <input id="dt" type="date"><br><br>
      <button class="btn green" onclick="addPayment(${id})">Save</button>

      <h4>History</h4>
      <div class="timeline">
        ${events.map(e=>`<div>${formatDate(e.date)} - ${e.text}</div>`).join("")}
      </div>
    </div>
  `;
};

window.back=()=>{
  document.getElementById("detail-view").style.display="none";
  document.getElementById("cashbook-view").style.display="block";
};

// -------- ADD PAYMENT --------
window.addPayment = async(id)=>{
  const amt = document.getElementById("amt").value;
  const dt = document.getElementById("dt").value;

  if(!amt || !dt) return alert("Enter all fields");

  const {error} = await supabase.from("payments").insert([{
    borrower_id:id,
    amount:Number(amt),
    payment_date:dt
  }]);

  if(error){ alert("Error"); return; }

  alert("Saved");
  showDetail(id);
};

load();
</script>
</body>
</html>
